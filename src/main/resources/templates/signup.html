<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA | Register</title><link rel="stylesheet" href="/css/auth.css?v=20261013-final-review-r2"><link rel="stylesheet" href="/css/nexora-ui.css?v=20261013-final-review-r2">
</head><body><main class="auth-shell"><section class="auth-card wide"><a class="auth-brand" href="/login"><img src="/images/nexora-logo.svg?v=20261011-brand6" alt="NEXORA"></a><h1>Create your student account</h1><p class="muted">Enter your SRM email ID with or without <b>@srmist.edu.in</b>. NEXORA will use the full institutional address for OTP verification. NEXORA creates your student record automatically; no teacher-side MySQL entry is required.</p><div th:if="${error}" class="error" th:text="${error}"></div><form method="post" action="/signup" class="grid-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div><label>Registration Number</label><input name="registrationNo" required placeholder="RA..."/></div><div><label>SRMIST Email</label><input type="text" name="email" required placeholder="ns3476 or ns3476@srmist.edu.in"/></div><div><label>Password</label><input type="password" name="password" minlength="8" required/></div><div><label>Confirm Password</label><input type="password" name="confirmPassword" minlength="8" required/></div><div><label>Full Name</label><input name="fullName" required/></div><div><label>Department</label><select name="department"><option>CSE - Computer Science and Engineering</option><option>Other</option></select></div><div><label>Program</label><select name="program"><option>B.Tech</option><option>M.Tech</option><option>Other</option></select></div><div><label>Section</label><input name="section" required placeholder="A"/></div><div><label>Batch Start Year</label><input type="number" name="batchStart" value="2025" min="2020" required/></div><div><label>Batch End Year</label><input type="number" name="batchEnd" value="2029" min="2021" required/></div><div><label>Current Year</label><select name="currentYear"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div><div><label>Current Semester</label><select name="currentSemester"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div><div class="full"><button type="submit">Create NEXORA Account →</button></div></form><p class="foot">Already registered? <a href="/login">Sign in</a></p></section></main><script src="/js/nexora-ui.js?v=20261013-final-review-r2" defer></script>
</body></html>
