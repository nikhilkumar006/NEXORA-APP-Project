<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA | Verify Email</title><link rel="stylesheet" href="/css/auth.css?v=20261013-final-review-r2"><link rel="stylesheet" href="/css/nexora-ui.css?v=20261013-final-review-r2">
</head><body><main class="auth-shell"><section class="auth-card"><a class="auth-brand" href="/login"><img src="/images/nexora-logo.svg?v=20261011-brand6" alt="NEXORA"></a><h1>Verify your SRMIST email</h1><p class="muted">We sent a 6-digit code to <b th:text="${email}">student@srmist.edu.in</b>.</p><div th:if="${error}" class="error" th:text="${error}"></div><div th:if="${message}" class="success" th:text="${message}"></div><form method="post" action="/verify-email"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="email" th:value="${email}"><label>Verification code</label><input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" placeholder="123456"><button type="submit">Verify & Create Account →</button></form><form method="post" action="/verify-email/resend" style="margin-top:12px"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="email" th:value="${email}"><button type="submit" class="secondary">Resend code</button></form><p class="foot"><a href="/signup">Back to registration</a></p></section></main><script src="/js/nexora-ui.js?v=20261013-final-review-r2" defer></script>
</body></html>
