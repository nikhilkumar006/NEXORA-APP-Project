<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA | Verify Login</title><link rel="stylesheet" href="/css/auth.css?v=20261013-final-review-r2"><link rel="stylesheet" href="/css/nexora-ui.css?v=20261013-final-review-r2">
</head><body><main class="auth-shell"><section class="auth-card"><a class="auth-brand" href="/login"><img src="/images/nexora-logo.svg?v=20261011-brand6" alt="NEXORA"></a><h1>Verify your login</h1><p class="muted">We sent a 6-digit OTP to <b th:text="${maskedEmail}">your registered SRMIST email</b>. The code expires in <b>5 minutes</b>.</p><div th:if="${error}" class="error" th:text="${error}"></div><div th:if="${message}" class="success" th:text="${message}"></div><form method="post" action="/verify-login"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>One-time password</label><input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" placeholder="123456"><button type="submit">Verify & Sign In →</button></form><form method="post" action="/verify-login/resend" style="margin-top:12px"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="secondary">Resend OTP</button></form><p class="foot"><a href="/login">Back to login</a></p></section></main><script src="/js/nexora-ui.js?v=20261013-final-review-r2" defer></script>
</body></html>
