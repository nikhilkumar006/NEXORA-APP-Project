<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXORA | Review session ended</title>
  <link rel="stylesheet" href="/css/auth.css?v=20261013-final-review-r2">
  <style>
    body{min-height:100vh;margin:0;display:grid;place-items:center;background:#07101f;color:#eef4ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box}
    .ended-card{width:min(100%,480px);box-sizing:border-box;background:#0e1b30;border:1px solid #263b5a;border-radius:22px;padding:34px;box-shadow:0 24px 70px #0006;text-align:center}
    .ended-mark{width:58px;height:58px;border-radius:50%;margin:0 auto 20px;display:grid;place-items:center;background:#123c31;color:#7de6ba;font-size:28px}
    .ended-card h1{margin:0 0 12px;font-size:clamp(25px,5vw,32px)}.ended-card p{line-height:1.65;color:#b8c7dc}
    .ended-actions{display:grid;gap:12px;margin-top:24px}.ended-actions button,.ended-actions a{box-sizing:border-box;width:100%;display:block;padding:13px 16px;border:1px solid #385273;border-radius:11px;background:#122640;color:#eef4ff;font:inherit;font-weight:650;text-decoration:none;cursor:pointer}
    .ended-actions button{background:linear-gradient(110deg,#5428f5,#7629d8);border-color:transparent}.ended-note{font-size:12px;color:#8da2bf!important;margin-top:18px}
  </style>
</head>
<body>
  <main class="ended-card">
    <div class="ended-mark" aria-hidden="true">✓</div>
    <h1>Review session ended</h1>
    <p>You have been signed out of this local NEXORA review session. Protected pages will not reopen until you explicitly start the review again.</p>
    <div class="ended-actions">
      <form method="post" action="/review/reenter">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Return to NEXORA review</button>
      </form>

    </div>
    <p class="ended-note">Local review access is a development convenience, not a production authentication method.</p>
  </main>
</body>
</html>
