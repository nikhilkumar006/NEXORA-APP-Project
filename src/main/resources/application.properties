spring.application.name=NEXORA

# Local preview bypass is opt-in for local development only. Never enable it in production.
# Local preview bypass is disabled by default; enable only deliberately for isolated demos.
nexora.dev-access.enabled=${NEXORA_DEV_ACCESS:false}
# Optional local-review entitlement for premium modules; does not bypass authentication.
nexora.premium-review-access.enabled=${NEXORA_PREMIUM_REVIEW_ACCESS_ENABLED:false}
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexora}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
nexora.google.enabled=${NEXORA_GOOGLE_ENABLED:false}
nexora.integrations.github.enabled=${GITHUB_OAUTH_ENABLED:false}
nexora.integrations.linkedin.enabled=${LINKEDIN_OAUTH_ENABLED:false}
nexora.drive.semester3.folder-id=${NEXORA_DRIVE_FOLDER_ID:}
nexora.drive.upload-folder-id=${NEXORA_DRIVE_UPLOAD_FOLDER_ID:${NEXORA_DRIVE_FOLDER_ID:}}
nexora.swing.enabled=${NEXORA_SWING:false}


# SRM email verification (required for public student registration)
spring.mail.host=${NEXORA_MAIL_HOST:}
spring.mail.port=${NEXORA_MAIL_PORT:587}
spring.mail.username=${NEXORA_MAIL_USERNAME:}
spring.mail.password=${NEXORA_MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=${NEXORA_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${NEXORA_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${NEXORA_MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${NEXORA_MAIL_SSL:false}
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=${NEXORA_MAIL_CONNECTION_TIMEOUT:20000}
spring.mail.properties.mail.smtp.timeout=${NEXORA_MAIL_READ_TIMEOUT:20000}
spring.mail.properties.mail.smtp.writetimeout=${NEXORA_MAIL_WRITE_TIMEOUT:20000}
spring.mail.properties.mail.smtp.quitwait=false
nexora.mail.from=${NEXORA_MAIL_FROM:${NEXORA_MAIL_USERNAME:}}


# OCR (Tess4J / Tesseract)
nexora.ocr.enabled=${NEXORA_OCR_ENABLED:true}
nexora.ocr.tessdata-path=${NEXORA_TESSDATA_PATH:tessdata}
nexora.ocr.language=${NEXORA_OCR_LANGUAGE:eng}
nexora.ocr.dpi=${NEXORA_OCR_DPI:300}

# Academic resource archive (local fallback alongside Google Drive)
nexora.academic.resources-dir=${NEXORA_ACADEMIC_RESOURCES_DIR:./data/academic-resources}

# Performance: reuse database connections, avoid needless refresh writes, compress responses,
# and let browsers cache versioned static assets.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.initialization-fail-timeout=${DB_INITIALIZATION_FAIL_TIMEOUT:1}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.tomcat.threads.max=${SERVER_MAX_THREADS:100}
server.tomcat.threads.min-spare=${SERVER_MIN_SPARE_THREADS:10}
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.thymeleaf.cache=true
